<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardTrack — Sign in</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#0d0d14;color:#c8c8d8;min-height:100vh;
     display:flex;align-items:center;justify-content:center}
.card{background:#13131f;border:1px solid #2a2a3d;border-radius:12px;padding:2rem;width:320px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;justify-content:center}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#7c3aed,#5b21b6);
           border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px}
.logo-text{font-size:18px;font-weight:600;color:#e8e8f4}
.logo-text span{color:#a78bfa}
h1{font-size:14px;color:#4a4a6a;text-transform:uppercase;letter-spacing:.08em;
   margin-bottom:1rem;text-align:center}
label{display:block;font-size:11px;color:#7c7c95;margin-bottom:.25rem;margin-top:.75rem}
input{width:100%;box-sizing:border-box;font-size:13px;padding:9px 12px;border-radius:8px;
       border:1px solid #2a2a3d;background:#0d0d14;color:#c8c8d8;outline:none}
input:focus{border-color:rgba(124,58,237,.5)}
button{width:100%;margin-top:1.25rem;padding:10px;border:0;border-radius:8px;
       background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-weight:600;
       cursor:pointer;font-size:13px}
button:hover{opacity:.9}
.flash{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3);
       padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:1rem}
</style>
</head>
<body>
<form class="card" method="POST" action="{{ url_for('login') }}">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div class="logo-text">Guard<span>Track</span></div>
  </div>
  <h1>Owner sign in</h1>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  <label>Username</label>
  <input type="text" name="username" autocomplete="username" required autofocus>
  <label>Password</label>
  <input type="password" name="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
